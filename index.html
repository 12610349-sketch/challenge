<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>先生からの挑戦状</title>
    <style>
        /* 背景と全体のスタイル */
        body { background: #2c3e50; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        
        /* 封筒の箱 */
        .envelope-wrapper { position: relative; cursor: pointer; transition: 0.5s; }
        
        /* 封筒の見た目（CSSだけで描いています） */
        .envelope { position: relative; width: 280px; height: 180px; background: #e74c3c; border-radius: 0 0 5px 5px; }
        .envelope::before { content: ""; position: absolute; top: 0; left: 0; border-left: 140px solid transparent; border-right: 140px solid transparent; border-top: 100px solid #c0392b; transform-origin: top; transition: 0.5s; z-index: 3; }
        
        /* 開いた時のアニメーション */
        .open .envelope::before { transform: rotateX(180deg); z-index: 1; }

        /* 中の手紙 */
        .letter { position: absolute; top: 10px; left: 10px; width: 260px; background: #fff; color: #333; padding: 20px; box-sizing: border-box; transition: 0.8s; z-index: 2; border-radius: 5px; opacity: 0; transform: translateY(0); }
        .open .letter { transform: translateY(-120px); opacity: 1; z-index: 4; height: 400px; overflow-y: auto; }

        /* ミッションの項目 */
        .mission { border-bottom: 1px dashed #ccc; padding: 10px 0; display: flex; align-items: center; cursor: pointer; }
        .mission.cleared { text-decoration: line-through; color: #aaa; background: #f9f9f9; }
        .mission.cleared::after { content: " 済"; color: red; font-weight: bold; margin-left: auto; border: 2px solid red; padding: 2px; border-radius: 50%; transform: rotate(-15deg); }

        h2 { color: #e74c3c; font-size: 18px; margin-top: 0; }
        p { font-size: 14px; margin: 5px 0; }
    </style>
</head>
<body>

    <div class="envelope-wrapper" id="envelope">
        <div class="envelope"></div>
        <div class="letter">
            <h2>📜 先生からの挑戦状</h2>
            <p>タップしてミッションを消せ！</p>
            <hr>
            <div class="mission" onclick="clearMission(this)">🎢 話したことがない生徒から
                                                                  おすすめなアトラクションを聞き出そう！</div>
            <div class="mission" onclick="clearMission(this)">🎡 カラフルな観覧車を背景に写真を撮ろう</div>
            <div class="mission" onclick="clearMission(this)">🎨 絵具の花壇を発見！</div>
            <div class="mission" onclick="clearMission(this)">🤝 スタッフに挨拶しよう！</div>
	    <div class="mission" onclick="clearMission(this)">🚪 ルスツにどこでもドア！？</div>
            <div class="mission" onclick="clearMission(this)"></div>
        </div>
    </div>

    <script>
        // 封筒を開ける処理
        document.getElementById('envelope').addEventListener('click', function() {
            this.classList.add('open');
        });

        // ミッションを消す処理
        function clearMission(el) {
            event.stopPropagation(); // 封筒が閉じるのを防ぐ
            el.classList.toggle('cleared');
        }
    </script>
</body>
</html>
<style> #tiiny-host-badge, .tiiny-host-bar { display: none !important; } </style>
